name: Build QPKG

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint (shellcheck)
        run: make lint

      - name: Check image pins
        run: make check-pins

      - name: Lifecycle test
        run: make test-lifecycle

      - name: new-app test
        run: make test-new-app

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Install QDK
        run: |
          sudo apt-get update
          sudo apt-get install -y git make gcc libc6-dev rsync xz-utils dos2unix
          git clone --depth 1 https://github.com/qnap-dev/QDK.git /tmp/QDK
          cd /tmp/QDK && sudo ./InstallToUbuntu.sh install

      - name: Normalize line endings
        run: |
          find . -type f \( -name '*.sh' -o -name 'package_routines' -o -name 'qpkg.cfg' -o -name '*.conf*' -o -name 'images.lock' \) -exec dos2unix {} +

      - name: Build QPKG
        run: |
          export PATH="/usr/share/QDK/bin:$PATH"
          qbuild --build-arch x86_64

      - name: Release files and checksums
        run: make release-files

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            build/*.qpkg
            build/images.lock

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qpkg
          path: |
            build/*.qpkg
            build/*.md5
            build/images.lock
            build/LICENSE
            build/SHA256SUMS

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.qpkg
            build/*.md5
            build/images.lock
            build/LICENSE
            build/SHA256SUMS
          generate_release_notes: true
