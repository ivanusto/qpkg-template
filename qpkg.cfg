# QPKG configuration (QDK / qbuild). See https://github.com/qnap-dev/QDK
#
# Run scripts/new-app.sh once to rename MyApp / myapp / "My App" everywhere.

# Internal name. App Center treats two packages with the same internal
# name as the same app and force-"updates" one over the other, so never
# reuse the bare upstream name (e.g. "Jellyfin"): a QNAP Store app of that
# name would overwrite yours. Pick something distinctive.
QPKG_NAME="MyApp"
# Name shown in App Center.
QPKG_DISPLAY_NAME="My App"
# Version of the management scripts, NOT of the upstream image. The image
# version lives in images.lock.
QPKG_VER="0.2.2"
QPKG_AUTHOR="qpkg-template contributors"
QPKG_LICENSE="Apache-2.0"
QPKG_SUMMARY="Thin QPKG shell: management scripts and a first-run status page only. The container image is downloaded by Container Station after installation."

# Preferred number in the start/stop sequence. It does not guarantee that
# Container Station is ready when the service script runs; the script
# defers the start in the background when it is not.
QPKG_RC_NUM="150"
# Service script, installed as /etc/init.d/<this name>.
QPKG_SERVICE_PROGRAM="myapp.sh"

# Container Station provides the docker CLI.
QPKG_REQUIRE="container-station >= 3.0"
QTS_MINI_VERSION="5.0.0"

# App Center "Open" link. The service script keeps Web_Port in qpkg.conf
# in step with WEB_PORT, so a custom port does not strand the link here.
QPKG_WEBUI="/"
QPKG_WEB_PORT="8190"

QDK_DATA_DIR_ICONS="icons"
QDK_DATA_DIR_X86_64="x86_64"
QDK_DATA_DIR_SHARED="shared"
